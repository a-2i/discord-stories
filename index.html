<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Stories</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #313338;
            color: white;
            font-family: Arial, sans-serif;
        }

        .stories {
            display: flex;
            gap: 15px;
            padding: 20px;
            background: #2b2d31;
        }

        .story {
            width: 70px;
            padding: 0;
            border: 0;
            background: transparent;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #5865f2;
            margin: auto;
            background: #5865f2;
            transition: transform 0.15s;
        }

        .story:hover .avatar {
            transform: scale(1.08);
        }

        .story p {
            margin: 5px 0;
            font-size: 12px;
        }

        .story-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #111214;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .story-viewer.active {
            display: flex;
        }

.story-content {
    width: min(420px, 90vw);
    height: min(750px, 90vh);
    background: #18191c;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.story-content img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 15px;
    z-index: 1;
}

.story-user {
    position: absolute;
    top: 20px;
    left: 20px;
    font-weight: bold;
    z-index: 2;
}

.close {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    font-size: 22px;
    cursor: pointer;
    z-index: 3;
}
            width: min(420px, 90vw);
            height: min(750px, 90vh);
            background: linear-gradient(160deg, #5865f2, #18191c);
            border-radius: 15px;
            position: relative;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .story-content h2 {
            font-size: 28px;
        }

        .story-user {
            position: absolute;
            top: 20px;
            left: 20px;
            font-weight: bold;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 22px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="stories">

        <button class="story" data-user="You" type="button">
            <div class="avatar"></div>
            <p>You</p>
        </button>

        <button class="story" data-user="Amigo" type="button">
            <div class="avatar"></div>
            <p>Amigo</p>
        </button>

        <button class="story" data-user="Ahmed" type="button">
            <div class="avatar"></div>
            <p>Ahmed</p>
        </button>

    </div>

    <div class="story-viewer" id="storyViewer">

        <div class="story-content">

            <div class="story-user" id="storyUser">
                User
            </div>

            <button class="close" id="closeStory" type="button">
                ×
            </button>

<img
    id="storyImage"
    src="https://picsum.photos/400/700"
    alt="Story image"
>

        </div>

    </div>

    <script>
        const stories = document.querySelectorAll(".story");
        const viewer = document.getElementById("storyViewer");
        const closeButton = document.getElementById("closeStory");
        const storyUser = document.getElementById("storyUser");

        stories.forEach(function(story) {
            story.addEventListener("click", function() {
                storyUser.textContent = story.dataset.user;
                viewer.classList.add("active");
            });
        });

        closeButton.addEventListener("click", function() {
            viewer.classList.remove("active");
        });

        viewer.addEventListener("click", function(event) {
            if (event.target === viewer) {
                viewer.classList.remove("active");
            }
        });

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                viewer.classList.remove("active");
            }
        });
    </script>

</body>
</html>
