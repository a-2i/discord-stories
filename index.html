<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Stories</title>

    <style>
        body {
            margin: 0;
            background: #313338;
            color: white;
            font-family: Arial, sans-serif;
        }

        .stories {
            display: flex;
            gap: 15px;
            padding: 20px;
            background: #2b2d31;
        }

        .story {
            width: 70px;
            text-align: center;
            cursor: pointer;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #5865f2;
            margin: auto;
            background: #5865f2;
        }

        .story p {
            margin: 5px 0;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="stories">

        <div class="story">
            <div class="avatar"></div>
            <p>You</p>
        </div>

        <div class="story">
            <div class="avatar"></div>
            <p>Amigo</p>
        </div>

        <div class="story">
            <div class="avatar"></div>
            <p>Ahmed</p>
        </div>

    </div>

</body>
</html>
